name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # The only check that catches "worked in the monorepo, broken on npm". Packs the cli and
  # installs the tarball in a temp directory outside the workspace, so nothing resolves through
  # the pnpm workspace links.
  cold-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Pack the cli
        working-directory: apps/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
      - name: Install and run the tarball outside the workspace
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/coordrooms-*.tgz
          ./node_modules/.bin/coordrooms --version
          ./node_modules/.bin/coordrooms --help
          test -d node_modules/coordrooms/migrations
          test -f node_modules/coordrooms/assets/coordrooms/SKILL.md
          test -f node_modules/coordrooms/assets/dashboard/server/index.mjs
          test -d node_modules/coordrooms/assets/dashboard/migrations
          test -d node_modules/coordrooms/assets/dashboard/public/assets
          node -e "require('@libsql/client')"
      - name: Smoke test the packaged dashboard
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/coordrooms-*.tgz
          test_home="$(mktemp -d)"
          HOME="$test_home" ./node_modules/.bin/coordrooms dashboard --port 61937 > dashboard.log 2> dashboard.err &
          dashboard_pid=$!
          trap 'kill "$dashboard_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:61937/ > dashboard.html; then
              break
            fi
            sleep 0.25
          done
          grep -q 'CoordRooms' dashboard.html
          if HOME="$test_home" ./node_modules/.bin/coordrooms dashboard --port 61937 2> collision.err; then
            exit 1
          fi
          grep -q 'port_in_use' collision.err
          kill "$dashboard_pid"
          wait "$dashboard_pid" || true
          trap - EXIT
