packages:
  - apps/*
  - packages/*

# Nextra's prop schemas are built on `z.custom()`, whose implicit-optional behaviour changed
# after zod 4.1. On 4.4 every `<Layout>` render fails validation on its own `children` prop.
overrides:
  nextra>zod: 4.1.12
  nextra-theme-docs>zod: 4.1.12

allowBuilds:
  '@libsql/client': true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalog:
  '@libsql/client': 0.17.4
  '@types/express': 5.0.6
  '@remixicon/react': 4.9.0
  '@tanstack/react-query': 5.90.20
  '@tanstack/react-router': 1.170.29
  '@tanstack/router-plugin': 1.168.32
  '@tailwindcss/postcss': 4.3.3
  '@tailwindcss/vite': 4.3.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@vitejs/plugin-react': 6.0.5
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  express: 5.2.1
  next: 16.3.0
  nextra: 4.6.1
  nextra-theme-docs: 4.6.1
  oxfmt: 0.62.0
  oxlint: 1.77.0
  pagefind: 1.5.2
  react: 19.2.8
  react-dom: 19.2.8
  tailwindcss: 4.3.3
  tsup: 8.5.1
  tsx: 4.21.1
  turbo: 2.10.9
  typescript: 7.0.2
  vite: 8.2.1
  vitest: 4.1.10
  zod: 4.4.3

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.9'
  - '@turbo/darwin-arm64@2.10.9'
  - '@turbo/linux-64@2.10.9'
  - '@turbo/linux-arm64@2.10.9'
  - '@turbo/windows-64@2.10.9'
  - '@turbo/windows-arm64@2.10.9'
  - turbo@2.10.9
  - '@tanstack/react-router@1.170.23'
